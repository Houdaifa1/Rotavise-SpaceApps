# Serves the built web app and forwards /api to the API container. The API sets
# its own security headers, so /api responses are passed through untouched.
# Add Strict-Transport-Security here when HTTPS is added in front of this proxy.
server_tokens off;
client_max_body_size 8m;
client_body_timeout 15s;
client_header_timeout 15s;
send_timeout 30s;

server {
  listen 8080 default_server;
  server_name _;
  root /usr/share/nginx/html;

  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    # Per-client quotas live in the API, which sees the real address through
    # X-Forwarded-For; a proxy-level limit would count every visitor as one
    # address once a tunnel sits in front of this proxy.
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite, never append: a client must not be able to choose its address.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location /assets/ {
    include /etc/nginx/rotavise-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/rotavise-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
