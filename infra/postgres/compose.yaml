name: rotavise-dev
services:
  postgres:
    image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    environment:
      POSTGRES_USER: rotavise
      POSTGRES_PASSWORD: rotavise_local_only
      POSTGRES_DB: rotavise
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - rotavise-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rotavise -d rotavise"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  rotavise-pg:
