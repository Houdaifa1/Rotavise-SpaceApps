<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Rotavise — map selection prototype</title>
    <style>
      :root {
        --ink: #14201a;
        --paper: #f3f4f1;
        --heat: #b4512d;
        --veg: #2fa84f;
        --ease: cubic-bezier(0.2, 1, 0.3, 1);
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: #7d8b66;
        font:
          15px/1.4 system-ui,
          -apple-system,
          "Helvetica Neue",
          Arial,
          sans-serif;
        color: var(--ink);
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: crosshair;
      }
      .pill {
        position: fixed;
        top: 14px;
        left: 14px;
        right: 14px;
        display: flex;
        align-items: center;
        gap: 14px;
        background: rgba(243, 244, 241, 0.94);
        border-radius: 999px;
        padding: 8px 8px 8px 16px;
        box-shadow: 0 6px 24px rgba(20, 32, 26, 0.18);
        max-width: 640px;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 8px;
        font:
          700 18px Georgia,
          serif;
      }
      .mark {
        display: flex;
        gap: 2px;
      }
      .mark i {
        width: 6px;
        height: 18px;
        display: block;
      }
      .steps {
        display: flex;
        gap: 6px;
        margin-left: auto;
        font: 600 12px system-ui;
      }
      .steps span {
        padding: 6px 11px;
        border-radius: 999px;
        color: #5e6a62;
      }
      .steps .on {
        background: var(--ink);
        color: var(--paper);
      }
      .hint {
        position: fixed;
        top: 78px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--paper);
        padding: 9px 16px;
        border-radius: 999px;
        font-size: 14px;
        transition:
          opacity 0.4s,
          transform 0.4s var(--ease);
        white-space: nowrap;
      }
      .hint.gone {
        opacity: 0;
        transform: translate(-50%, -10px);
        pointer-events: none;
      }
      .sheet {
        position: fixed;
        left: 14px;
        right: 14px;
        bottom: 14px;
        max-width: 460px;
        background: var(--paper);
        border-radius: 22px;
        padding: 18px 20px 20px;
        box-shadow: 0 10px 40px rgba(20, 32, 26, 0.28);
        transform: translateY(130%);
        transition: transform 0.55s var(--ease);
      }
      .sheet.up {
        transform: none;
      }
      .k {
        font: 600 11px system-ui;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #5e6a62;
      }
      .area {
        font:
          700 46px/1 Georgia,
          serif;
        margin: 4px 0 2px;
      }
      .area small {
        font-size: 20px;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 12px 0 16px;
      }
      .chip {
        font: 600 12px system-ui;
        border: 1px solid var(--ink);
        border-radius: 999px;
        padding: 4px 10px;
        opacity: 0;
        transform: translateY(6px);
        transition:
          opacity 0.3s,
          transform 0.4s var(--ease);
      }
      .sheet.up .chip {
        opacity: 1;
        transform: none;
      }
      .sheet.up .chip:nth-child(2) {
        transition-delay: 0.08s;
      }
      .sheet.up .chip:nth-child(3) {
        transition-delay: 0.16s;
      }
      .sheet.up .chip:nth-child(4) {
        transition-delay: 0.24s;
      }
      .btns {
        display: flex;
        gap: 8px;
      }
      button {
        font: 600 15px system-ui;
        border: 0;
        border-radius: 999px;
        padding: 13px 22px;
        cursor: pointer;
        transition:
          transform 0.2s var(--ease),
          background 0.2s;
      }
      button:active {
        transform: scale(0.96);
      }
      .go {
        background: var(--heat);
        color: #fff;
        flex: 1;
      }
      .ghost {
        background: transparent;
        border: 1px solid var(--ink);
        color: var(--ink);
      }
      .strip {
        display: flex;
        gap: 4px;
        margin: 12px 0 4px;
      }
      .strip b {
        flex: 1;
        height: 0;
        border-radius: 4px;
        transition: height 0.5s var(--ease);
        color: #fff;
        font: 600 11px/46px system-ui;
        text-align: center;
        overflow: hidden;
      }
      .strip.in b {
        height: 46px;
      }
      .note {
        position: fixed;
        right: 14px;
        top: 14px;
        font-size: 11px;
        color: var(--paper);
        background: rgba(20, 32, 26, 0.7);
        padding: 4px 9px;
        border-radius: 999px;
        display: none;
      }
      @media (max-width: 700px) {
        .steps span:not(.on) {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div class="pill">
      <div class="logo">
        <div class="mark">
          <i style="background: #e0a82e"></i><i style="background: #4c8a3b"></i
          ><i style="background: #a5815d"></i
          ><i style="background: #1f5c46"></i>
        </div>
        Rotavise
      </div>
      <div class="steps">
        <span class="on">1 Field</span><span>2 Crops</span
        ><span>3 Priorities</span><span>4 Options</span>
      </div>
    </div>
    <div class="hint" id="hint">
      Drag across the map to paint your field, cell by cell
    </div>
    <div class="sheet" id="sheet">
      <div class="k" id="k1">Your field</div>
      <div class="area"><span id="ha">0.00</span><small> ha</small></div>
      <div class="row">
        <span class="chip" id="c1">0 NASA cells (30 m)</span
        ><span class="chip">Rain: GPM 10 km</span
        ><span class="chip">Soil moisture: SMAP 9 km</span
        ><span class="chip">Terrain: NASADEM 30 m</span>
      </div>
      <div id="crops" style="display: none">
        <div class="k">Last 4 seasons</div>
        <div class="strip" id="strip">
          <b style="background: #e0a82e">Durum wheat</b
          ><b style="background: #a5815d">Fallow</b
          ><b style="background: #e0a82e">Durum wheat</b
          ><b style="background: #a5815d">Fallow</b>
        </div>
        <p class="k" style="margin: 6px 0 12px">Tap a block to change it</p>
      </div>
      <div class="btns">
        <button class="ghost" id="clear">Clear</button
        ><button class="go" id="go">Continue to crops →</button>
      </div>
    </div>
    <script>
      const cv = document.getElementById("c"),
        ctx = cv.getContext("2d");
      const CELL = 34;
      let W,
        H,
        dpr,
        img,
        painted = new Map(),
        hover = null,
        down = false,
        mode = "add",
        shown = 0;
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let seed = 11;
      const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
      function build() {
        dpr = Math.min(devicePixelRatio || 1, 2);
        W = innerWidth;
        H = innerHeight;
        cv.width = W * dpr;
        cv.height = H * dpr;
        const o = document.createElement("canvas");
        o.width = cv.width;
        o.height = cv.height;
        const g = o.getContext("2d");
        g.scale(dpr, dpr);
        seed = 11;
        const pal = [
          "#8a9a62",
          "#a3a76d",
          "#7e9156",
          "#b3a874",
          "#6f8450",
          "#9c9560",
          "#8f9f6c",
          "#b9b27c",
        ];
        g.fillStyle = "#7d8b66";
        g.fillRect(0, 0, W, H);
        for (let y = -40; y < H;) {
          const h = 70 + rnd() * 90;
          for (let x = -60; x < W;) {
            const w = 80 + rnd() * 170;
            g.fillStyle = pal[(rnd() * pal.length) | 0];
            g.fillRect(x, y, w - 3, h - 3);
            g.save();
            g.beginPath();
            g.rect(x, y, w - 3, h - 3);
            g.clip();
            g.strokeStyle = "rgba(40,50,20,.10)";
            g.lineWidth = 1;
            const ang = rnd() < 0.5 ? 0 : Math.PI / 2;
            for (let t = 0; t < 260; t += 5) {
              g.beginPath();
              if (ang === 0) {
                g.moveTo(x, y + t);
                g.lineTo(x + w, y + t);
              } else {
                g.moveTo(x + t, y);
                g.lineTo(x + t, y + h);
              }
              g.stroke();
            }
            g.restore();
            x += w;
          }
          y += h;
        }
        g.strokeStyle = "rgba(120,150,175,.9)";
        g.lineWidth = 7;
        g.beginPath();
        g.moveTo(0, H * 0.72);
        g.bezierCurveTo(W * 0.25, H * 0.6, W * 0.5, H * 0.85, W, H * 0.66);
        g.stroke();
        img = o;
      }
      const key = (x, y) => x + "," + y;
      const cellAt = (e) => [
        Math.floor(e.clientX / CELL),
        Math.floor(e.clientY / CELL),
      ];
      const ease = (t) => 1 - Math.pow(1 - t, 3);
      let last = null;
      function paint(e) {
        const [cx, cy] = cellAt(e);
        if (last) {
          const n = Math.max(Math.abs(cx - last[0]), Math.abs(cy - last[1]));
          for (let i = 1; i < n; i++)
            paintCell(
              Math.round(last[0] + ((cx - last[0]) * i) / n),
              Math.round(last[1] + ((cy - last[1]) * i) / n),
            );
        }
        last = [cx, cy];
        paintCell(cx, cy);
      }
      function paintCell(cx, cy) {
        if (cy * CELL < 70) return;
        const k = key(cx, cy);
        if (mode === "add" && !painted.has(k)) {
          const near = painted.size ? 0 : 0;
          painted.set(k, { x: cx, y: cy, t: performance.now() + near });
          update();
        } else if (mode === "del" && painted.has(k)) {
          painted.delete(k);
          update();
        }
      }
      function update() {
        document.getElementById("hint").classList.add("gone");
        document
          .getElementById("sheet")
          .classList.toggle("up", painted.size > 0);
        document.getElementById("c1").textContent =
          painted.size + " NASA cells (30 m)";
      }
      function draw(now) {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, W, H);
        ctx.drawImage(img, 0, 0, W, H);
        ctx.strokeStyle = "rgba(255,255,255,.10)";
        ctx.lineWidth = 1;
        if (hover) {
          for (let dx = -3; dx <= 3; dx++)
            for (let dy = -3; dy <= 3; dy++) {
              const d = Math.hypot(dx, dy);
              if (d > 3.2) continue;
              ctx.globalAlpha = 0.5 * (1 - d / 3.4);
              ctx.strokeRect(
                (hover[0] + dx) * CELL + 0.5,
                (hover[1] + dy) * CELL + 0.5,
                CELL,
                CELL,
              );
            }
          ctx.globalAlpha = 1;
          ctx.fillStyle = "rgba(255,255,255,.28)";
          ctx.fillRect(hover[0] * CELL, hover[1] * CELL, CELL, CELL);
        }
        painted.forEach((c) => {
          const t = reduce ? 1 : Math.min(1, Math.max(0, (now - c.t) / 280)),
            s = 0.45 + 0.55 * ease(t);
          ctx.globalAlpha = ease(t);
          ctx.fillStyle = "rgba(47,168,79,.42)";
          const w = CELL * s,
            o = (CELL - w) / 2;
          ctx.fillRect(c.x * CELL + o, c.y * CELL + o, w, w);
        });
        ctx.globalAlpha = 1;
        ctx.strokeStyle = "#14201a";
        ctx.lineWidth = 3;
        ctx.lineCap = "square";
        ctx.beginPath();
        painted.forEach((c) => {
          const X = c.x * CELL,
            Y = c.y * CELL;
          if (!painted.has(key(c.x, c.y - 1))) {
            ctx.moveTo(X, Y);
            ctx.lineTo(X + CELL, Y);
          }
          if (!painted.has(key(c.x, c.y + 1))) {
            ctx.moveTo(X, Y + CELL);
            ctx.lineTo(X + CELL, Y + CELL);
          }
          if (!painted.has(key(c.x - 1, c.y))) {
            ctx.moveTo(X, Y);
            ctx.lineTo(X, Y + CELL);
          }
          if (!painted.has(key(c.x + 1, c.y))) {
            ctx.moveTo(X + CELL, Y);
            ctx.lineTo(X + CELL, Y + CELL);
          }
        });
        ctx.stroke();
        const target = painted.size * 0.09;
        shown += (target - shown) * (reduce ? 1 : 0.18);
        if (Math.abs(target - shown) < 0.001) shown = target;
        document.getElementById("ha").textContent = shown.toFixed(2);
        requestAnimationFrame(draw);
      }
      cv.addEventListener("pointerdown", (e) => {
        last = null;
        down = true;
        cv.setPointerCapture(e.pointerId);
        const [cx, cy] = cellAt(e);
        mode = painted.has(key(cx, cy)) ? "del" : "add";
        paint(e);
      });
      cv.addEventListener("pointermove", (e) => {
        hover = cellAt(e);
        if (down) paint(e);
      });
      cv.addEventListener("pointerup", () => {
        down = false;
        last = null;
      });
      cv.addEventListener("pointerleave", () => (hover = null));
      document.getElementById("clear").onclick = () => {
        painted.clear();
        update();
        document.getElementById("crops").style.display = "none";
        document.getElementById("strip").classList.remove("in");
        document.getElementById("go").textContent = "Continue to crops →";
        document.getElementById("k1").textContent = "Your field";
      };
      document.getElementById("go").onclick = () => {
        const cr = document.getElementById("crops");
        cr.style.display = "block";
        document.getElementById("k1").textContent = "Your field · step 2";
        document.getElementById("go").textContent = "Continue to priorities →";
        requestAnimationFrame(() =>
          requestAnimationFrame(() =>
            document.getElementById("strip").classList.add("in"),
          ),
        );
      };
      addEventListener("resize", build);
      build();
      requestAnimationFrame(draw);
    </script>
  </body>
</html>
